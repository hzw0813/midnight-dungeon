<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="color-scheme" content="dark">
  <title>深夜地牢 | Midnight Dungeon v0.2</title>
  <style>
    :root {--bg:#090f1b; --panel:#141f31; --panel2:#1a2940; --border:#293951;--text:#edf5ff;--muted:#9cacc5;--accent:#8fe9c2;--amber:#f5c77b;--red:#ff8d94}
    *{box-sizing:border-box} html{background:var(--bg)} body{margin:0;min-height:100dvh;color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% -20%,#253959 0%,transparent 47%),var(--bg);overscroll-behavior-y:contain}
    button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent} button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    main{width:min(100%,520px);padding: max(12px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-icon{width:41px;height:41px;display:grid;place-items:center;border:1px solid #476159;background:#183730;border-radius:13px;color:#a5f7d3;font-size:25px}
    h1{font-size:19px;line-height:1.16;margin:0;font-weight:800;letter-spacing:.03em} .subtitle{margin:4px 0 0;color:var(--muted);font-size:11px;font-weight:650;letter-spacing:.14em}
    .top-actions{display:flex;gap:7px}.mini{background:#1a293d;border:1px solid #38506b;border-radius:11px;padding:10px 12px;font-size:12px;font-weight:700;min-height:40px}
    .stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-bottom:10px}.stat{border:1px solid var(--border);border-radius:12px;background:rgba(22,35,54,.95);padding:8px 11px;min-height:62px;display:flex;flex-direction:column;justify-content:center}.stat-label{font-size:10px;color:#a8b9d1;font-weight:800;letter-spacing:.08em}.stat-value{margin-top:3px;font-size:17px;line-height:1.2;font-weight:850;font-variant-numeric:tabular-nums}.stat:first-child .stat-value{color:#ffa2a7}.stat:nth-child(3) .stat-value{color:#f2ce83}
    .hpbar{height:4px;margin-top:7px;border-radius:9px;background:#442b3f;overflow:hidden}.hpbar span{height:100%;display:block;background:linear-gradient(90deg,#ff817e,#ffc2a3);width:100%;transition:width .16s ease}
    .arena{border:1px solid #384968;border-radius:17px;background:#101c2e;position:relative;padding:10px;display:flex;justify-content:center;box-shadow:0 15px 40px #050a125c,inset 0 0 0 1px #1a293e;overflow:hidden}
    canvas{display:block;width:min(100%,calc(43dvh * 11 / 13),440px);height:auto;aspect-ratio:11/13;border-radius:8px;touch-action:none;background:#0e1828;image-rendering:auto}
    .board-note{position:absolute;right:15px;top:17px;background:#0a1628a6;border:1px solid #3b4b5e;border-radius:20px;padding:4px 9px;color:#b7d6e0;font-size:10px;pointer-events:none}
    .notice{min-height:44px;display:flex;align-items:center;gap:10px;background:#172438;border:1px solid var(--border);padding:9px 13px;border-radius:11px;margin:10px 0;color:#cfdeec;font-size:12px;line-height:1.5}
    .notice i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px #8fe9c272;flex-shrink:0}
    .controls{display:grid;grid-template-columns: 1.5fr 1fr;gap:15px;align-items:center}
    .dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px;max-width:218px;justify-self:center;width:100%}
    .control{background:linear-gradient(#293c56,#223249);border:1px solid #50617e;box-shadow:inset 0 1px #ffffff20,0 3px 0 #0b1525;border-radius:13px;min-height:46px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s,background .1s}.control:active,.control.pressed{transform:translateY(2px);box-shadow:inset 0 1px #ffffff20,0 1px 0 #0b1525;background:#31516b}.control[data-dir="up"]{grid-column:2;grid-row:1}.control[data-dir="left"]{grid-column:1;grid-row:2}.control[data-dir="right"]{grid-column:3;grid-row:2}.control[data-dir="down"]{grid-column:2;grid-row:3}.dpad-center{grid-column:2;grid-row:2;display:grid;place-items:center;color:#59728a;font-size:18px}
    .actions{display:grid;gap:9px}.action{min-height:59px;border:1px solid #4b947e;border-radius:14px;background:linear-gradient(120deg,#224e47,#276352);display:flex;justify-content:center;align-items:center;gap:8px;font-size:13px;font-weight:850;box-shadow:0 3px 0 #0e3029}.action span{font-size:18px}.action:active{transform:translateY(2px);box-shadow:none}.action.secondary{background:linear-gradient(120deg,#364258,#2e3a52);border-color:#516481;box-shadow:0 3px 0 #1a2437}.action small{opacity:.8;font-size:11px}
    .progress-panel{background:#142237;border:1px solid #2b4261;border-radius:12px;margin:-3px 0 10px;padding:9px 12px}
    .progress-top{display:flex;align-items:center;gap:8px;font-size:11px;white-space:nowrap;justify-content:space-between;color:#c1d2e5}
    .progress-top strong{color:#a5f7d3;font-size:13px}.progress-top span:nth-child(2){color:#91d6c0}
    .xpbar{height:5px;border-radius:9px;overflow:hidden;background:#1f384a;margin-top:7px}.xpbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#70c4ee,#98f0bf);transition:width .18s}
    .stats{grid-template-columns:1.35fr 1fr 1.1fr}.stat-value{font-size:17px}.stat:nth-child(3) .stat-value{color:#bfa7ff}
    .top-actions{gap:5px;flex-shrink:0}.top-actions .mini{padding:8px 9px;min-height:38px;white-space:nowrap}
    header{gap:7px}.brand{gap:7px}.brand-icon{flex-shrink:0}.subtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:185px;font-size:9px;letter-spacing:.08em}
    .action{min-height:49px}.actions{gap:8px}
    .modal p{white-space:pre-line}.modal-actions{flex-direction:column!important;align-items:stretch}.modal-actions button{width:100%;text-align:center;min-height:43px}
    .modal button:disabled{opacity:.4;cursor:not-allowed}.action:disabled{opacity:.55;cursor:not-allowed}
    .hint{text-align:center;font-size:11px;line-height:1.5;color:#7f92ad;margin-top:13px}
    .shade{position:fixed;inset:0;background:rgba(4,9,17,.76);display:none;align-items:center;justify-content:center;padding:20px;z-index:5;backdrop-filter:blur(7px)}.shade.open{display:flex}.modal{width:min(100%,410px);border:1px solid #516a80;border-radius:20px;background:#17263b;box-shadow:0 35px 90px #0009;padding:23px;text-align:center;max-height:85dvh;overflow-y:auto}.modal .eyebrow{font-weight:800;letter-spacing:.14em;color:var(--accent);font-size:11px}.modal h2{font-size:26px;margin:9px 0;color:#f6f6fa}.modal p{color:#bdcde0;line-height:1.7;font-size:14px}.modal .big{font-size:36px;margin-top:3px}.modal .modal-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px;justify-content:center}.modal button{padding:12px 15px;border-radius:11px;border:1px solid #5d9787;background:#265548;font-size:13px;font-weight:750}.modal button.secondary{background:#293b52;border-color:#5a6d89}.modal textarea{margin-top:8px;width:100%;height:200px;background:#0c1626;color:#cce6eb;border:1px solid #415a70;border-radius:10px;padding:10px;font:11px/1.5 ui-monospace,monospace;resize:vertical;text-align:left}
    @media(max-width:390px){h1{font-size:17px}.stat-value{font-size:16px}.progress-top{font-size:10px;gap:5px}.top-actions .mini{padding:7px 8px}.brand-icon{width:36px;height:36px}}
    @media (max-height:750px){header{margin-bottom:7px}.stats{margin-bottom:7px}.stat{min-height:54px;padding:6px 10px}.arena{padding:7px}canvas{width:min(100%,calc(41dvh * 11 / 13),440px)}.notice{min-height:37px;margin:7px 0;padding:6px 10px}.control{min-height:42px}.action{min-height:55px}.hint{margin-top:10px}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div class="brand-icon" aria-hidden="true">✦</div><div><h1>深夜地牢</h1><p class="subtitle">ENDLESS DUNGEON · V0.2</p></div></div>
    <div class="top-actions"><button class="mini" id="debugBtn" type="button">紀錄</button><button class="mini" id="campBtn" type="button">營地</button><button class="mini" id="restartBtn" type="button">重開</button></div>
  </header>
  <section class="stats" aria-label="遊戲狀態">
    <div class="stat"><div class="stat-label">生命 HP</div><div class="stat-value" id="hpText">10 / 10</div><div class="hpbar"><span id="hpBar"></span></div></div>
    <div class="stat"><div class="stat-label">無盡層數</div><div class="stat-value" id="floorText">1F</div></div>
    <div class="stat"><div class="stat-label">永久魂晶 ◆</div><div class="stat-value" id="shardText">0</div></div>
  </section>
  <section class="progress-panel" aria-label="角色成長">
    <div class="progress-top"><strong id="levelText">LV 1</strong><span id="xpText">0 / 5 XP</span><span id="battleStats">攻擊 1 · 金幣 0 · 擊殺 0</span></div>
    <div class="xpbar"><span id="xpBar"></span></div>
  </section>
  <div class="arena"><canvas id="board" width="440" height="520" aria-label="地牢遊戲畫面：可滑動移動角色"></canvas><div class="board-note" id="turnBadge">TURN 0</div></div>
  <div class="notice" aria-live="polite"><i></i><span id="notice">無盡地牢：打怪升級，突破每一層取得魂晶。</span></div>
  <section class="controls" aria-label="觸控遊戲操作">
    <div class="dpad">
      <button class="control" data-dir="up" type="button" aria-label="向上">↑</button>
      <button class="control" data-dir="left" type="button" aria-label="向左">←</button>
      <div class="dpad-center" aria-hidden="true">✦</div>
      <button class="control" data-dir="right" type="button" aria-label="向右">→</button>
      <button class="control" data-dir="down" type="button" aria-label="向下">↓</button>
    </div>
    <div class="actions">
      <button type="button" class="action" id="potionBtn"><span aria-hidden="true">✚</span> 治療 <small id="potionText">× 2</small></button>
      <button type="button" class="action secondary" id="shopBtn"><span aria-hidden="true">⚒</span> 鍛造商店</button>
      <button type="button" class="action secondary" id="waitBtn"><span aria-hidden="true">◷</span> 等待一回合</button>
    </div>
  </section>
  <div class="hint">擊殺累積 XP・每層三選一強化・每 5 層挑戰守衛</div>
</main>
<div class="shade" id="overlay" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="eyebrow" id="modalEyebrow">MIDNIGHT DUNGEON</div><div class="big" id="modalIcon">✦</div><h2 id="modalTitle">提示</h2><p id="modalText"></p><textarea id="debugText" readonly hidden spellcheck="false"></textarea><div class="modal-actions" id="modalActions"></div></section></div>
<script>
(function(){
  'use strict';
  const VERSION='0.2.0', WIDTH=11, HEIGHT=13, SAVE_KEY='midnight-dungeon-v0.2', OLD_SAVE_KEY='midnight-dungeon-v0.1';
  const DIRECTIONS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  const BLESSINGS={
    blade:{name:'狂戰之刃',description:'本輪攻擊 +1',icon:'⚔'},
    heart:{name:'生命源泉',description:'最大生命 +4，恢復 4 HP',icon:'♥'},
    vamp:{name:'鮮血契約',description:'擊殺時額外恢復 1 HP',icon:'◈'},
    fortune:{name:'貪婪之手',description:'每次擊殺額外獲得 2 金幣',icon:'✦'},
    potion:{name:'鍊金師',description:'立即獲得 3 瓶藥水',icon:'✚'},
    crit:{name:'幸運一擊',description:'暴擊率 +12%，最多 60%',icon:'✧'}
  };
  const TALENTS={
    might:{name:'永恆鋒芒',description:'新冒險基礎攻擊 +1',base:3,step:2},
    life:{name:'生命之根',description:'新冒險最大 HP +3',base:2,step:2},
    wealth:{name:'黃金祝福',description:'新冒險擊殺金幣 +1',base:2,step:2}
  };
  const $=id=>document.getElementById(id), canvas=$('board'), ctx=canvas.getContext('2d');
  let game, overlayMode='';
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
  const key=(x,y)=>y*WIDTH+x;
  const same=(a,b)=>a.x===b.x&&a.y===b.y;
  const random=s=>{s.rng=(Math.imul(s.rng,1664525)+1013904223)>>>0;return s.rng/4294967296;};
  const randInt=(s,n)=>Math.floor(random(s)*n);
  const isInside=(x,y)=>x>=0&&y>=0&&x<WIDTH&&y<HEIGHT;
  const isWalkable=(s,x,y)=>isInside(x,y)&&s.map[y][x]===0;
  const neighbors=(x,y)=>[[x,y-1],[x+1,y],[x,y+1],[x-1,y]];
  const xpRequired=level=>3+level*2;
  const attack=s=>1+Math.floor((s.level-1)/2)+s.bonuses.attack+s.meta.talents.might;
  const shopAttackCost=s=>12+s.shopAttackBuys*8;
  const shopPotionCost=8;
  const talentCost=(m,k)=>TALENTS[k].base+m.talents[k]*TALENTS[k].step;
  const fmt=n=>n<10000?String(n):n<1e7?(n/1000).toFixed(1)+'K':n<1e10?(n/1e6).toFixed(1)+'M':(n/1e9).toFixed(1)+'B';
  function initialMeta(){return {shards:0,highestFloor:1,totalRuns:0,totalKills:0,talents:{might:0,life:0,wealth:0}};}
  function copyMeta(m){if(!m)return initialMeta();return {shards:m.shards,highestFloor:m.highestFloor,totalRuns:m.totalRuns,totalKills:m.totalKills,talents:{might:m.talents.might,life:m.talents.life,wealth:m.talents.wealth}};}
  function distances(s,sx,sy){
    const d=Array.from({length:HEIGHT},()=>Array(WIDTH).fill(-1));
    const q=[[sx,sy]];let i=0;d[sy][sx]=0;
    while(i<q.length){const [x,y]=q[i++];for(const [nx,ny] of neighbors(x,y)){
      if(isWalkable(s,nx,ny)&&d[ny][nx]<0){d[ny][nx]=d[y][x]+1;q.push([nx,ny]);}
    }}return d;
  }
  function createState(seed,meta){
    const m=copyMeta(meta);m.totalRuns++;
    const maxHp=10+m.talents.life*3;
    const s={version:VERSION,seed:seed>>>0,rng:seed>>>0,floor:1,turn:0,level:1,xp:0,
      maxHp,hp:maxHp,coins:0,potions:2,kills:0,status:'playing',
      hero:{x:1,y:1},map:[],exit:null,enemies:[],loot:[],actions:[],events:[],
      notice:'無盡地牢已開啟。擊敗怪物、升級，尋找傳送門！',
      bonuses:{attack:0,vamp:0,gold:0,crit:0},shopAttackBuys:0,
      pendingBlessings:[],meta:m,runStartMeta:copyMeta(m),earnedShards:0,coinSettled:false};
    makeFloor(s);return s;
  }
  function log(s,text){s.notice=text;s.events.push('T'+s.turn+': '+text);if(s.events.length>50)s.events.shift();}
  function makeFloor(s){
    s.hero={x:1,y:1};s.map=Array.from({length:HEIGHT},(_,y)=>Array.from({length:WIDTH},(_,x)=>x===0||y===0||x===WIDTH-1||y===HEIGHT-1?1:0));
    for(let y=1;y<HEIGHT-1;y++)for(let x=1;x<WIDTH-1;x++){
      if((x<=2&&y<=2)||(x===1&&y<=4)||(y===1&&x<=4))continue;
      if(random(s)<.155)s.map[y][x]=1;
    }
    let dist=distances(s,1,1);
    for(let y=1;y<HEIGHT-1;y++)for(let x=1;x<WIDTH-1;x++)if(dist[y][x]<0)s.map[y][x]=1;
    dist=distances(s,1,1);
    const cells=[];
    for(let y=1;y<HEIGHT-1;y++)for(let x=1;x<WIDTH-1;x++)if(dist[y][x]>=0)cells.push({x,y,d:dist[y][x]});
    cells.sort((a,b)=>b.d-a.d||b.y-a.y||b.x-a.x);
    s.exit={x:cells[0].x,y:cells[0].y};s.enemies=[];s.loot=[];
    const used=new Set([key(1,1),key(s.exit.x,s.exit.y)]);
    function drawCell(minDist){
      const options=cells.filter(c=>c.d>=minDist&&!used.has(key(c.x,c.y)));
      if(!options.length)return null;
      const c=options[randInt(s,options.length)];used.add(key(c.x,c.y));return {x:c.x,y:c.y};
    }
    const isMilestone=s.floor%5===0;
    const enemyCount=Math.min(2+Math.floor(s.floor/2),7);
    for(let i=0;i<enemyCount;i++){
      const p=drawCell(5);if(!p)continue;
      const boss=isMilestone&&i===0;
      const normalHp=2+Math.floor((s.floor-1)*.8);
      const hp=normalHp+(boss?3+Math.floor(s.floor*.6):0);
      const damage=1+Math.floor((s.floor-1)/7)+(boss?1:0);
      s.enemies.push({...p,hp,maxHp:hp,damage,boss,id:'E'+s.floor+'-'+i});
    }
    for(let i=0;i<3;i++){
      const p=drawCell(2);if(!p)continue;
      s.loot.push({...p,type:i===0?'potion':'coin',amount:i===0?1:2+randInt(s,4)+Math.floor((s.floor-1)/5)});
    }
  }
  function enemyAt(s,x,y){return s.enemies.find(e=>e.x===x&&e.y===y);}
  function collect(s){
    const i=s.loot.findIndex(l=>same(l,s.hero));if(i<0)return '';
    const l=s.loot.splice(i,1)[0];if(l.type==='potion'){s.potions++;return '✚ 拾取治療藥水！';}
    s.coins+=l.amount;return '✦ 撿到 '+l.amount+' 金幣！';
  }
  function offerBlessings(s){
    const ids=Object.keys(BLESSINGS).filter(k=>k!=='crit'||s.bonuses.crit<5);
    for(let i=ids.length-1;i>0;i--){const j=randInt(s,i+1);[ids[i],ids[j]]=[ids[j],ids[i]];}
    return ids.slice(0,3);
  }
  function settleGold(s){
    if(s.coinSettled)return 0;
    const gain=Math.floor(s.coins/15);
    s.meta.shards+=gain;s.earnedShards+=gain;s.coinSettled=true;
    return gain;
  }
  function gainExperience(s,earned){
    s.xp+=earned;let ups=0;
    while(s.xp>=xpRequired(s.level)&&ups<100){
      s.xp-=xpRequired(s.level);s.level++;s.maxHp+=2;s.hp=clamp(s.hp+3,0,s.maxHp);ups++;
    }
    return ups;
  }
  function enemyTurn(s){
    const d=distances(s,s.hero.x,s.hero.y);let damage=0;
    for(const e of s.enemies){
      if(s.status!=='playing')break;
      const steps=d[e.y][e.x];if(steps<0||steps>7)continue;
      if(steps===1){const hit=e.damage||1;s.hp-=hit;damage+=hit;
        if(s.hp<=0){s.hp=0;s.status='lost';settleGold(s);break;}continue;}
      const candidates=neighbors(e.x,e.y).filter(([x,y])=>isWalkable(s,x,y)&&d[y][x]>=0&&d[y][x]<steps&&!(x===s.hero.x&&y===s.hero.y)&&!s.enemies.some(other=>other!==e&&other.x===x&&other.y===y));
      if(candidates.length){candidates.sort((a,b)=>d[a[1]][a[0]]-d[b[1]][b[0]]);e.x=candidates[0][0];e.y=candidates[0][1];}
    }return damage;
  }
  function applyBlessing(s,id){
    if(id==='blade')s.bonuses.attack++;
    if(id==='heart'){s.maxHp+=4;s.hp=clamp(s.hp+4,0,s.maxHp);}
    if(id==='vamp')s.bonuses.vamp++;
    if(id==='fortune')s.bonuses.gold+=2;
    if(id==='potion')s.potions+=3;
    if(id==='crit')s.bonuses.crit++;
  }
  function applyAction(s,a){
    if((s.status==='playing'||s.status==='choosing')&&a==='retire'){
      s.status='retired';settleGold(s);s.actions.push(a);log(s,'返回營地，魂晶已永久保留。');return true;
    }
    if(s.status==='choosing'){
      if(!a.startsWith('blessing:'))return false;
      const id=a.slice(9);if(!s.pendingBlessings.includes(id))return false;
      applyBlessing(s,id);s.pendingBlessings=[];s.status='playing';s.actions.push(a);
      log(s,'✦ 選擇 '+BLESSINGS[id].name+'！ '+BLESSINGS[id].description);return true;
    }
    if(s.status==='retired'||s.status==='lost'){
      if(!a.startsWith('talent:'))return false;
      const k=a.slice(7);if(!Object.hasOwn(TALENTS,k))return false;
      const cost=talentCost(s.meta,k);
      if(s.meta.shards<cost)return false;
      s.meta.shards-=cost;s.meta.talents[k]++;s.actions.push(a);
      log(s,'永久天賦「'+TALENTS[k].name+'」升級至 '+s.meta.talents[k]+'！');return true;
    }
    if(s.status!=='playing')return false;
    if(a==='shop:attack'){
      const cost=shopAttackCost(s);if(s.coins<cost)return false;
      s.coins-=cost;s.bonuses.attack++;s.shopAttackBuys++;s.actions.push(a);
      log(s,'⚒ 鍛造成功！本輪攻擊 +1。');return true;
    }
    if(a==='shop:potion'){
      if(s.coins<shopPotionCost)return false;
      s.coins-=shopPotionCost;s.potions+=2;s.actions.push(a);
      log(s,'補給成功！獲得 2 瓶藥水。');return true;
    }
    let msg='';
    if(a==='potion'){
      if(s.potions===0){log(s,'治療藥水用完了。');return false;}
      if(s.hp===s.maxHp){log(s,'生命值已滿，先保留藥水。');return false;}
      s.potions--;const healed=Math.min(5,s.maxHp-s.hp);s.hp+=healed;msg='✚ 使用藥水，回復 '+healed+' HP。';
    }else if(a==='wait')msg='等待了一回合。';
    else if(DIRECTIONS[a]){
      const [dx,dy]=DIRECTIONS[a],nx=s.hero.x+dx,ny=s.hero.y+dy;
      if(!isWalkable(s,nx,ny)){log(s,'前面是牆壁。');return false;}
      const enemy=enemyAt(s,nx,ny);
      if(enemy){
        const crit=random(s)<Math.min(.6,s.bonuses.crit*.12);
        const hit=crit?Math.ceil(attack(s)*1.75):attack(s);enemy.hp-=hit;
        msg=(crit?'✧ 暴擊！':'⚔ 攻擊！')+'造成 '+hit+' 傷害。';
        if(enemy.hp<=0){
          s.enemies=s.enemies.filter(e=>e!==enemy);s.kills++;s.meta.totalKills++;
          const earnedCoins=1+s.bonuses.gold+s.meta.talents.wealth+(enemy.boss?5+s.floor:0);
          s.coins+=earnedCoins;
          const healed=Math.min(s.maxHp-s.hp,s.bonuses.vamp);s.hp+=healed;
          const levelUps=gainExperience(s,1+Math.floor((s.floor-1)/3)+(enemy.boss?3:0));
          msg=(enemy.boss?'★ 擊敗守衛！':'✦ 擊敗怪物！')+' +'+earnedCoins+' 金幣'+(healed?'，吸血 +'+healed+' HP':'')+(levelUps?'，升級至 LV '+s.level+'！':'');
        }
      }else{
        if(nx===s.exit.x&&ny===s.exit.y&&s.enemies.some(e=>e.boss)){
          log(s,'★ 傳送門被守衛封印！擊敗守衛才能前進。');return false;
        }
        s.hero={x:nx,y:ny};msg=collect(s)||'繼續探索。';
      }
    }else return false;
    s.turn++;s.actions.push(a);
    if(s.actions.length>2000)s.actions.shift();
    if(same(s.hero,s.exit)){
      const completed=s.floor;
      const earned=1+(completed%5===0?4:0);
      s.meta.shards+=earned;s.earnedShards+=earned;
      s.floor++;s.meta.highestFloor=Math.max(s.meta.highestFloor,s.floor);
      s.hp=clamp(s.hp+2,0,s.maxHp);makeFloor(s);
      s.pendingBlessings=offerBlessings(s);s.status='choosing';
      log(s,'✦ 突破第 '+completed+' 層！永久獲得 '+earned+' 魂晶。從三種祝福中選一項。');return true;
    }
    const damage=enemyTurn(s);
    if(s.status==='lost')msg='☾ 你倒下了！已將金幣折算為魂晶，返回營地強化自己。';
    else if(damage)msg+=' 受到 '+damage+' 點傷害。';
    log(s,msg);return true;
  }
  const goodInt=(n,min=0)=>Number.isSafeInteger(n)&&n>=min;
  function validMeta(m){return !!(m&&goodInt(m.shards)&&goodInt(m.highestFloor,1)&&goodInt(m.totalRuns)&&goodInt(m.totalKills)&&m.talents&&['might','life','wealth'].every(k=>goodInt(m.talents[k])));}
  function validateSave(s){
    return !!(s&&s.version===VERSION&&goodInt(s.seed)&&s.seed<=4294967295&&goodInt(s.rng)&&s.rng<=4294967295&&goodInt(s.floor,1)&&goodInt(s.turn)&&goodInt(s.level,1)&&goodInt(s.xp)&&goodInt(s.maxHp,1)&&goodInt(s.hp)&&s.hp<=s.maxHp&&goodInt(s.coins)&&goodInt(s.potions)&&goodInt(s.kills)&&validMeta(s.meta)&&validMeta(s.runStartMeta)&&s.bonuses&&['attack','vamp','gold','crit'].every(k=>goodInt(s.bonuses[k]))&&goodInt(s.shopAttackBuys)&&goodInt(s.earnedShards)&&typeof s.coinSettled==='boolean'&&
      s.hero&&goodInt(s.hero.x)&&goodInt(s.hero.y)&&Array.isArray(s.map)&&s.map.length===HEIGHT&&s.map.every(row=>Array.isArray(row)&&row.length===WIDTH&&row.every(c=>c===0||c===1))&&isWalkable(s,s.hero.x,s.hero.y)&&s.exit&&goodInt(s.exit.x)&&goodInt(s.exit.y)&&isWalkable(s,s.exit.x,s.exit.y)&&Array.isArray(s.enemies)&&s.enemies.every(e=>isWalkable(s,e.x,e.y)&&goodInt(e.hp,1)&&goodInt(e.maxHp,1)&&goodInt(e.damage,1)&&typeof e.boss==='boolean')&&
      Array.isArray(s.loot)&&Array.isArray(s.actions)&&Array.isArray(s.events)&&Array.isArray(s.pendingBlessings)&&s.pendingBlessings.every(k=>Object.hasOwn(BLESSINGS,k))&&['playing','choosing','lost','retired'].includes(s.status));
  }
  function migrateLegacy(old){
    if(!old||old.version!=='0.1.0'||!old.map||!Array.isArray(old.enemies)||!Array.isArray(old.loot))return null;
    const s=createState(old.seed,initialMeta());
    if(!Number.isSafeInteger(old.floor)||old.floor<1||old.floor>3)return null;
    if(!Array.isArray(old.map)||old.map.length!==HEIGHT)return null;
    Object.assign(s,{
      rng:old.rng,floor:old.floor,turn:old.turn,maxHp:old.maxHp,hp:old.hp,coins:old.coins,potions:old.potions,kills:old.kills,
      status:old.status==='playing'?'playing':'retired',hero:old.hero,map:old.map,exit:old.exit,
      enemies:old.enemies.map(e=>({...e,damage:1,boss:false})),loot:old.loot,
      actions:old.actions,events:old.events,notice:'v0.1 進度已轉入無盡地牢。'
    });
    s.meta.shards=Math.max(0,old.status==='won'?3:old.floor-1);
    s.earnedShards=s.meta.shards;
    if(s.status==='retired')settleGold(s);
    return validateSave(s)?s:null;
  }
  function store(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(game));}catch(_){/* ephemeral browser */}}
  function restore(){try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(raw){const data=JSON.parse(raw);if(validateSave(data))return data;}
    const legacy=localStorage.getItem(OLD_SAVE_KEY);
    if(legacy)return migrateLegacy(JSON.parse(legacy));
  }catch(_){/* blocked or invalid */}return null;}
  const writeText=(el,text)=>{el.textContent=text;};
  function circle(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
  function roundRect(x,y,w,h,r,color){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill();}
  function renderBoard(s){
    const T=40;ctx.clearRect(0,0,440,520);
    ctx.fillStyle='#0f192a';ctx.fillRect(0,0,440,520);
    for(let y=0;y<HEIGHT;y++)for(let x=0;x<WIDTH;x++){
      const px=x*T,py=y*T;
      if(s.map[y][x]){
        ctx.fillStyle=(x+y)%3===0?'#27394b':'#2b4052';ctx.fillRect(px+1,py+1,38,38);
        ctx.fillStyle='#354e61';ctx.fillRect(px+2,py+2,36,4);
        ctx.fillStyle='#17283a';ctx.fillRect(px+2,py+34,36,4);
        ctx.fillStyle='#1e3040';ctx.fillRect(px+19,py+5,2,28);
      }else{
        ctx.fillStyle=(x+y)%2===0?'#142437':'#16283d';ctx.fillRect(px,py,40,40);
        ctx.strokeStyle='#233c51';ctx.lineWidth=.65;ctx.strokeRect(px+.5,py+.5,39,39);
        circle(px+9,py+12,1.1,'#274257');circle(px+30,py+28,.8,'#244156');
      }
    }
    const ex=s.exit.x*T+20,ey=s.exit.y*T+20;
    circle(ex,ey,16,'#174945');circle(ex,ey,12,'#378b81');circle(ex,ey,8,'#0f292f');circle(ex,ey,4,'#a5f2d5');
    ctx.strokeStyle='#a9f6df';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ex,ey,14,.3,4.2);ctx.stroke();
    if(s.enemies.some(e=>e.boss)){ctx.strokeStyle='#faaf73';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ex,ey,17,0,Math.PI*2);ctx.stroke();}
    for(const l of s.loot){const x=l.x*T+20,y=l.y*T+20;
      if(l.type==='potion'){
        roundRect(x-7,y-4,14,15,3,'#ea739b');roundRect(x-4,y-9,8,6,1,'#c3dee4');roundRect(x-4,y,8,6,2,'#ffb1ca');
      }else{circle(x,y,10,'#bd833a');circle(x,y,7,'#e9c676');circle(x-2,y-2,2,'#fff0bb');}
    }
    for(const e of s.enemies){const x=e.x*T+20,y=e.y*T+20;
      ctx.fillStyle=e.boss?'#be824c':'#8d61a2';ctx.beginPath();ctx.ellipse(x,y+3,e.boss?17:14,e.boss?15:12,0,0,Math.PI*2);ctx.fill();
      if(e.boss){ctx.fillStyle='#ffdf91';ctx.beginPath();ctx.moveTo(x-11,y-5);ctx.lineTo(x-8,y-22);ctx.lineTo(x-1,y-12);ctx.lineTo(x+8,y-23);ctx.lineTo(x+11,y-5);ctx.fill();}
      circle(x-5,y,3.5,'#f9f6fb');circle(x+5,y,3.5,'#f9f6fb');circle(x-4,y+1,1.5,'#29253e');circle(x+6,y+1,1.5,'#29253e');
      ctx.fillStyle='#4d314f';ctx.fillRect(x-9,y-17,18,3);ctx.fillStyle=e.boss?'#ffd38c':'#ffa1ba';ctx.fillRect(x-9,y-17,Math.max(0,Math.round(18*e.hp/e.maxHp)),3);
    }
    const hx=s.hero.x*T+20,hy=s.hero.y*T+20;
    circle(hx,hy+3,16,'#1c5a58');circle(hx,hy,12,'#71d8c5');
    ctx.fillStyle='#b4ffe1';ctx.beginPath();ctx.moveTo(hx,hy-16);ctx.lineTo(hx+10,hy-3);ctx.lineTo(hx-10,hy-3);ctx.closePath();ctx.fill();
    circle(hx-4,hy+3,2,'#113c43');circle(hx+4,hy+3,2,'#113c43');circle(hx-4,hy-7,3,'#e7fff9');
  }
  function render(){
    writeText($('hpText'),fmt(game.hp)+' / '+fmt(game.maxHp));$('hpBar').style.width=(100*game.hp/game.maxHp)+'%';
    writeText($('floorText'),fmt(game.floor)+'F');writeText($('shardText'),fmt(game.meta.shards));
    writeText($('levelText'),'LV '+fmt(game.level));writeText($('xpText'),fmt(game.xp)+' / '+fmt(xpRequired(game.level))+' XP');
    $('xpBar').style.width=(100*game.xp/xpRequired(game.level))+'%';
    writeText($('battleStats'),'攻擊 '+fmt(attack(game))+'　·　金幣 '+fmt(game.coins)+'　·　擊殺 '+fmt(game.kills));
    writeText($('potionText'),'× '+fmt(game.potions));writeText($('notice'),game.notice);writeText($('turnBadge'),'TURN '+fmt(game.turn));
    $('potionBtn').disabled=game.status!=='playing';$('waitBtn').disabled=game.status!=='playing';$('shopBtn').disabled=game.status!=='playing';
    renderBoard(game);
  }
  function openModal(opts){
    overlayMode=opts.mode||'notice';writeText($('modalEyebrow'),opts.eyebrow||'MIDNIGHT DUNGEON');
    writeText($('modalIcon'),opts.icon||'✦');writeText($('modalTitle'),opts.title);writeText($('modalText'),opts.text||'');
    $('debugText').hidden=!opts.debug;if(opts.debug)$('debugText').value=makeReport();
    const actions=$('modalActions');actions.replaceChildren();for(const button of opts.buttons){
      const el=document.createElement('button');el.type='button';el.textContent=button.label;el.disabled=!!button.disabled;
      if(button.secondary)el.classList.add('secondary');el.addEventListener('click',button.action);actions.appendChild(el);
    }$('overlay').classList.add('open');
  }
  function closeModal(){$('overlay').classList.remove('open');overlayMode='';}
  function makeReport(){
    return JSON.stringify({game:'Midnight Dungeon',version:VERSION,seed:game.seed,floor:game.floor,turn:game.turn,status:game.status,
      level:game.level,xp:game.xp,hp:game.hp,maxHp:game.maxHp,attack:attack(game),coins:game.coins,kills:game.kills,
      meta:game.meta,runStartMeta:game.runStartMeta,earnedShards:game.earnedShards,bonuses:game.bonuses,
      offeredBlessings:game.pendingBlessings,actions:game.actions,events:game.events,
      map:game.map.map(row=>row.map(n=>n?'#':'.').join(''))},null,2);
  }
  function openDebug(){openModal({mode:'debug',icon:'⌘',title:'測試紀錄',text:'包含亂數種子、永久天賦、指令和目前狀態，可複製回 ChatGPT。',debug:true,buttons:[
    {label:'複製紀錄',action:async()=>{const txt=makeReport();try{await navigator.clipboard.writeText(txt);writeText($('modalText'),'已複製測試紀錄。');}catch(_){$('debugText').focus();$('debugText').select();writeText($('modalText'),'請長按下面的紀錄並選擇「拷貝」。');}}},
    {label:'關閉',secondary:true,action:()=>{closeModal();endIfNeeded();}}
  ]});}
  function performFromModal(cmd,next){closeModal();const changed=applyAction(game,cmd);if(changed)store();render();if(next)next();else endIfNeeded();}
  function openBlessing(){
    const milestone=(game.floor-1)%5===0;
    openModal({mode:'reward',icon:milestone?'★':'✦',eyebrow:'FLOOR CLEARED',
      title:'第 '+(game.floor-1)+' 層突破！',text:'已取得永久魂晶。挑選一種本輪強化，打造自己的流派：',
      buttons:game.pendingBlessings.map(id=>({label:BLESSINGS[id].icon+' '+BLESSINGS[id].name+'｜'+BLESSINGS[id].description,action:()=>performFromModal('blessing:'+id)}))});
  }
  function openShop(){
    if(game.status!=='playing')return;
    openModal({mode:'shop',icon:'⚒',title:'旅途鍛造',text:'使用這輪獲得的金幣，即刻強化本次冒險。持有 '+game.coins+' 金幣。',buttons:[
      {label:'攻擊 +1｜'+shopAttackCost(game)+' 金幣',disabled:game.coins<shopAttackCost(game),action:()=>performFromModal('shop:attack',openShop)},
      {label:'藥水 +2｜'+shopPotionCost+' 金幣',disabled:game.coins<shopPotionCost,action:()=>performFromModal('shop:potion',openShop)},
      {label:'回到地牢',secondary:true,action:closeModal}
    ]});
  }
  function openCamp(){
    const resting=game.status==='lost'||game.status==='retired';
    if(!resting){
      openModal({mode:'camp-peek',icon:'◆',title:'靈魂營地',text:'永久魂晶：'+game.meta.shards+' ｜ 最高樓層：'+game.meta.highestFloor+'F\n永久天賦需要先結束本次冒險才可升級。已取得的魂晶不會消失。',buttons:[
        {label:'繼續探險',action:closeModal},
        {label:'結束本輪並回營地',secondary:true,action:()=>openModal({mode:'confirm',icon:'☾',title:'確定返回營地？',text:'結束本輪探索，金幣每 15 枚轉換 1 魂晶。永久魂晶與天賦不會消失。',buttons:[
          {label:'確認結算',action:()=>performFromModal('retire')},{label:'取消',secondary:true,action:closeModal}
        ]})}
      ]});return;
    }
    const texts=['魂晶：'+fmt(game.meta.shards)+'　｜　歷史最高 '+fmt(game.meta.highestFloor)+'F',
      '本輪到達 '+fmt(game.floor)+'F　｜　擊殺 '+fmt(game.kills)+'　｜　獲得魂晶 '+fmt(game.earnedShards),
      '永久天賦在下一輪冒險生效，升級價格會逐步提高。'];
    const buttons=Object.keys(TALENTS).map(k=>{
      const t=TALENTS[k],cost=talentCost(game.meta,k);
      return {label:t.name+' Lv.'+game.meta.talents[k]+' → '+(game.meta.talents[k]+1)+'｜'+cost+' 魂晶',
        disabled:game.meta.shards<cost,action:()=>performFromModal('talent:'+k,openCamp)};
    });
    buttons.push({label:'開始新冒險',action:()=>restart((Date.now()>>>0)||1)});
    buttons.push({label:'相同種子重玩',secondary:true,action:()=>restart(game.seed)});
    buttons.push({label:'查看紀錄',secondary:true,action:openDebug});
    openModal({mode:'camp',icon:'◆',eyebrow:'PERMANENT GROWTH',title:'靈魂營地',text:texts.join('\n'),buttons});
  }
  function askRestart(){
    if(game.status==='lost'||game.status==='retired'){openCamp();return;}
    openModal({mode:'confirm',icon:'↻',title:'開始另一輪？',text:'將結算本輪金幣，保留魂晶與永久天賦。想先升級永久天賦，可使用「營地」。',buttons:[
      {label:'結算並換新地圖',action:()=>{applyAction(game,'retire');restart((Date.now()>>>0)||1);}},
      {label:'取消',secondary:true,action:()=>{closeModal();endIfNeeded();}}
    ]});
  }
  function endIfNeeded(){
    if(game.status==='choosing')openBlessing();
    else if(game.status==='lost'||game.status==='retired')openCamp();
  }
  function action(a){if(overlayMode)return;const changed=applyAction(game,a);if(changed)store();render();endIfNeeded();}
  function restart(seed){game=createState(seed,game.meta);store();closeModal();render();}
  for(const el of document.querySelectorAll('[data-dir]'))el.addEventListener('click',()=>action(el.dataset.dir));
  $('waitBtn').addEventListener('click',()=>action('wait'));
  $('potionBtn').addEventListener('click',()=>action('potion'));
  $('shopBtn').addEventListener('click',openShop);
  $('campBtn').addEventListener('click',openCamp);
  $('debugBtn').addEventListener('click',openDebug);
  $('restartBtn').addEventListener('click',askRestart);
  $('overlay').addEventListener('click',e=>{if(e.target===$('overlay')&&['shop','debug','camp-peek','confirm'].includes(overlayMode)){closeModal();endIfNeeded();}});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&overlayMode&&['shop','debug','camp-peek','confirm'].includes(overlayMode)){closeModal();endIfNeeded();return;}
    if(overlayMode)return;
    const dirs={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',h:'potion',' ':'wait'};
    const act=dirs[e.key];if(act){e.preventDefault();action(act);}
  });
  let touch=null;
  canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY,pointer:e.pointerId};});
  canvas.addEventListener('pointerup',e=>{
    if(!touch||touch.pointer!==e.pointerId)return;
    const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<22){
      const rect=canvas.getBoundingClientRect();const x=Math.floor((e.clientX-rect.left)/rect.width*WIDTH),y=Math.floor((e.clientY-rect.top)/rect.height*HEIGHT);
      const dist=Math.abs(x-game.hero.x)+Math.abs(y-game.hero.y);
      if(dist===1)action(x>game.hero.x?'right':x<game.hero.x?'left':y>game.hero.y?'down':'up');return;
    }action(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  });
  canvas.addEventListener('pointercancel',()=>{touch=null;});
  // A deterministic, scriptable API used for regression tests, not an online service.
  window.MidnightDungeonTest={createState,applyAction,distances,validateSave,migrateLegacy,attack,xpRequired,offerBlessings,talentCost,settleGold,VERSION,WIDTH,HEIGHT};
  game=restore()||createState((Date.now()>>>0)||1);store();render();endIfNeeded();
})();
</script>
